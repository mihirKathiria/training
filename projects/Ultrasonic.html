<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Goggle - Ultrasonic Simulation</title>
    <style>
        :root {
            --sky-bg: linear-gradient(to bottom, #38bdf8, #bae6fd);
            --ground-bg: #22c55e;
            --accent-color: #facc15;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --wave-out-color: #3b82f6;
            --wave-echo-color: #fb923c;
            --alert-color: #ef4444;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* Project Header */
        #project-header {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 50;
        }

        #project-header h1 {
            margin: 0;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #0f172a;
            text-shadow: 0 2px 4px rgba(255,255,255,0.3);
        }

        /* Main Simulation Area */
        #world {
            position: relative;
            width: 100%;
            height: 100vh;
            background: var(--sky-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ground */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25vh;
            background: var(--ground-bg);
            border-top: 8px solid #16a34a;
        }

        /* Bricked Wall */
        #wall {
            position: absolute;
            right: 0;
            top: 0;
            width: 120px;
            height: 75vh;
            background-color: #991b1b;
            background-image: 
                linear-gradient(335deg, #7f1d1d 23px, transparent 23px),
                linear-gradient(155deg, #7f1d1d 23px, transparent 23px),
                linear-gradient(335deg, #7f1d1d 23px, transparent 23px),
                linear-gradient(155deg, #7f1d1d 23px, transparent 23px);
            background-size: 58px 58px;
            background-position: 0px 2px, 4px 35px, 29px 31px, 34px 6px;
            border-left: 10px solid #450a0a;
            box-shadow: -10px 0 30px rgba(0,0,0,0.2);
        }

        .label {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Goggle Container */
        #goggle-container {
            position: absolute;
            left: 10%; 
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: left 0.1s linear;
        }

        /* Indicator Speaker */
        #indicator-speaker {
            margin-bottom: 20px;
            opacity: 0.2;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #indicator-speaker.active {
            opacity: 1;
            transform: scale(1.1);
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }

        .goggle-svg {
            width: 280px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        /* Wave Container */
        #waves-zone {
            position: absolute;
            left: 220px;
            top: 50%;
            transform: translateY(-50%);
            height: 200px;
            pointer-events: none;
        }

        /* Wave Styles */
        .wave {
            position: absolute;
            border-radius: 50%;
            width: 15px;
            height: 80px;
            opacity: 0;
            border: 5px solid transparent;
        }

        /* Outward Waves (Blue) */
        .wave-out {
            border-right: 5px solid var(--wave-out-color);
            animation: move-out 2s infinite linear;
        }

        /* Echo Waves (Orange) */
        .wave-echo {
            border-left: 5px solid var(--wave-echo-color);
            animation: move-echo 2s infinite linear;
            display: none;
        }

        @keyframes move-out {
            0% { left: 0%; opacity: 0; height: 40px; }
            20% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 100%; opacity: 0; height: 180px; }
        }

        @keyframes move-echo {
            0% { left: 100%; opacity: 0; height: 180px; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { left: 0%; opacity: 0; height: 40px; }
        }

        /* Glass Control Panel */
        #control-panel {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
            z-index: 1000;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Merged Status Style */
        .panel-status {
            background: rgba(255,255,255,0.9);
            padding: 15px 25px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 220px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .status-info {
            display: flex;
            flex-direction: column;
        }

        .status-label {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .status-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f172a;
            font-family: monospace;
        }

        .control-group { flex: 1; display: flex; flex-direction: column; gap: 10px; }

        input[type=range] {
            width: 100%;
            height: 15px;
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 40px;
            height: 40px;
            background: #1e40af;
            border-radius: 50%;
            cursor: pointer;
            border: 4px solid white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .logic-card {
            background: #1e293b;
            color: #4ade80;
            padding: 15px 20px;
            border-radius: 16px;
            font-family: monospace;
            font-size: 1.1rem;
            min-width: 320px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #led-indicator { width: 14px; height: 14px; border-radius: 50%; background: #cbd5e1; }
        #led-indicator.active { 
            background: var(--alert-color); 
            box-shadow: 0 0 15px var(--alert-color); 
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse { from { opacity: 1; } to { opacity: 0.4; } }

        @media (max-width: 1100px) {
            #control-panel { flex-wrap: wrap; height: auto; }
            .logic-card { min-width: 100%; order: 4; }
        }

        @media (max-width: 767px) {
            html, body {
                width: 100%;
                height: auto;
                min-height: 100vh;
                min-height: 100svh;
                overflow-x: hidden;
                overflow-y: auto;
            }

            html {
                min-height: 100%;
            }

            #world {
                width: 100%;
                height: max(100vh, 820px);
                height: max(100svh, 820px);
                min-height: 820px;
                overflow: hidden;
            }

            #project-header {
                top: 16px;
                left: 16px;
                right: 16px;
            }

            #project-header h1 {
                font-size: clamp(1.25rem, 5vw, 2rem);
                letter-spacing: 1px;
            }

            #wall {
                width: clamp(64px, 18vw, 100px);
            }

            #goggle-container {
                top: 35%;
                left: 8%;
            }

            .goggle-svg {
                width: clamp(180px, 58vw, 280px);
            }

            #waves-zone {
                left: clamp(165px, 55vw, 220px);
                max-width: calc(100vw - 220px);
            }

            #control-panel {
                right: 12px;
                bottom: 12px;
                left: 12px;
                width: auto;
                max-width: none;
                transform: none;
                padding: 16px;
                gap: 12px;
                align-items: stretch;
                flex-direction: column;
            }

            .panel-status {
                min-width: 0;
                padding: 12px 16px;
            }

            .control-group {
                min-width: 0;
            }

            .logic-card {
                min-width: 0;
                width: 100%;
                padding: 12px 14px;
                font-size: clamp(0.8rem, 3.5vw, 1rem);
                overflow-wrap: anywhere;
            }

            input[type=range]::-webkit-slider-thumb {
                width: 32px;
                height: 32px;
            }
        }

        @media (max-width: 380px) {
            #control-panel {
                right: 8px;
                left: 8px;
                padding: 12px;
            }

            #goggle-container {
                left: 4%;
            }

            #waves-zone {
                left: 52vw;
            }
        }
    </style>
</head>
<body>

    <div id="world">
        <div id="project-header">
            <h1>Smart_Goggle Simulation</h1>
            <p>Safety_Threshold: <span style="color: #991b1b; font-weight: bold;">325cm (Fixed)</span></p>
        </div>

        <div id="wall">
            <span class="label" style="top: 20px; left: -110px;">Bricked Wall</span>
        </div>

        <div id="goggle-container">
            <div id="indicator-speaker">
                <span class="label" style="bottom: 180px;">Indicator_Speaker</span>
                <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path class="spk-w" d="M15.54 8.46a5 5 0 0 1 0 7.07" opacity="0"></path>
                    <path class="spk-w" d="M19.07 4.93a10 10 0 0 1 0 14.14" opacity="0"></path>
                </svg>
            </div>

            <div style="position: relative;">
                <span class="label" style="top: -25px; left: 50%; transform: translateX(-50%);">Smart_Goggle</span>
                <svg class="goggle-svg" viewBox="0 0 400 120">
                    <path d="M20,40 Q20,20 60,20 L340,20 Q380,20 380,40 L380,70 Q380,100 340,100 L240,100 Q200,100 200,80 Q200,100 160,100 L60,100 Q20,100 20,70 Z" fill="#1e293b"/>
                    <rect x="40" y="35" width="130" height="50" rx="15" fill="#334155"/>
                    <rect x="230" y="35" width="130" height="50" rx="15" fill="#334155"/>
                    <g transform="translate(165, 30)">
                        <rect x="0" y="0" width="70" height="35" rx="5" fill="#94a3b8"/>
                        <circle cx="18" cy="17" r="12" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>
                        <circle cx="52" cy="17" r="12" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>
                        <circle cx="18" cy="17" r="4" fill="#000"/>
                        <circle cx="52" cy="17" r="4" fill="#000"/>
                    </g>
                </svg>
            </div>

            <div id="waves-zone">
                <div class="wave wave-out" style="animation-delay: 0s"></div>
                <div class="wave wave-out" style="animation-delay: 0.5s"></div>
                <div class="wave wave-out" style="animation-delay: 1s"></div>
                <div class="wave wave-out" style="animation-delay: 1.5s"></div>
                <div class="wave wave-echo" style="animation-delay: 0s"></div>
                <div class="wave wave-echo" style="animation-delay: 0.5s"></div>
                <div class="wave wave-echo" style="animation-delay: 1s"></div>
                <div class="wave wave-echo" style="animation-delay: 1.5s"></div>
            </div>
        </div>

        <div id="ground"></div>

        <div id="control-panel">
            <!-- Merged Status Box -->
            <div class="panel-status">
                <div id="led-indicator"></div>
                <div class="status-info">
                    <span class="status-label">Current Distance</span>
                    <span class="status-value" id="status-text">400cm</span>
                </div>
            </div>

            <!-- Position Control -->
            <div class="control-group">
                <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; color: #0f172a;">
                    <span>Move Goggle</span>
                </div>
                <input type="range" id="pos-slider" min="5" max="85" value="20">
            </div>

            <!-- Logic Card -->
            <div class="logic-card" id="logic-display">
                if (distance < 325) { <br>
                &nbsp;&nbsp;Indicator_Speaker = ON;<br>
                }
            </div>
        </div>
    </div>

    <script>
        const posSlider = document.getElementById('pos-slider');
        const goggle = document.getElementById('goggle-container');
        const speaker = document.getElementById('indicator-speaker');
        const statusText = document.getElementById('status-text');
        const led = document.getElementById('led-indicator');
        const logicDisplay = document.getElementById('logic-display');
        const wavesZone = document.getElementById('waves-zone');
        const echoWaves = document.querySelectorAll('.wave-echo');
        const spkLines = document.querySelectorAll('.spk-w');

        const FIXED_THRESHOLD = 325;

        function updateSimulation() {
            const pos = posSlider.value;
            goggle.style.left = pos + '%';

            const rawDistance = 100 - pos; 
            const cmDistance = Math.round(rawDistance * 5.5); 

            statusText.innerText = cmDistance + 'cm';
            logicDisplay.innerHTML = `if (${cmDistance} < ${FIXED_THRESHOLD}) { <br>&nbsp;&nbsp;Indicator_Speaker = ON;<br>}`;

            const isDetected = cmDistance < FIXED_THRESHOLD;

            if (isDetected) {
                speaker.classList.add('active');
                led.classList.add('active');
                statusText.style.color = "#ef4444";
                spkLines.forEach(l => l.style.opacity = "1");
                echoWaves.forEach(w => w.style.display = "block");
            } else {
                speaker.classList.remove('active');
                led.classList.remove('active');
                statusText.style.color = "#0f172a";
                spkLines.forEach(l => l.style.opacity = "0");
                echoWaves.forEach(w => w.style.display = "none");
            }

            const wallX = window.innerWidth - 120;
            const goggleR = goggle.getBoundingClientRect().right;
            const gap = Math.max(0, wallX - goggleR);
            wavesZone.style.width = gap + 'px';
        }

        posSlider.addEventListener('input', updateSimulation);
        window.addEventListener('resize', updateSimulation);
        updateSimulation();
    </script>
</body>
</html>
