<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tap - IR Sensor Simulation</title>
    <style>
        :root {
            --bg-color: #1e293b;
            --wall-color: #7f1d1d;
            --water-color: #3b82f6;
            --ir-color: #ef4444; /* Red for Infrared */
            --accent-color: #22d3ee;
            --glass-bg: rgba(15, 23, 42, 0.8);
            --nfs-gradient: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: var(--bg-color);
            display: flex;
            color: white;
        }

        /* --- BACKGROUND & LAYOUT --- */
        #scene {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #0f172a, #334155);
            overflow: hidden;
        }

        /* --- WALL & SINK (RIGHT SIDE) --- */
        #wall-section {
            position: absolute;
            right: 0;
            top: 0;
            width: 300px;
            height: 100%;
            background-color: #450a0a;
            background-image: 
                linear-gradient(335deg, rgba(255,255,255,0.1) 23px, transparent 23px),
                linear-gradient(155deg, rgba(255,255,255,0.1) 23px, transparent 23px),
                linear-gradient(335deg, rgba(255,255,255,0.1) 23px, transparent 23px),
                linear-gradient(155deg, rgba(255,255,255,0.1) 23px, transparent 23px);
            background-size: 58px 58px;
            background-position: 0px 2px, 4px 35px, 29px 31px, 34px 6px;
            border-left: 15px solid #200505;
            box-shadow: -20px 0 50px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* SVG Sink & Tap Wrapper */
        #sink-assembly {
            position: absolute;
            top: 30%;
            right: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Tap Nozzle Pointing LEFT (Original logic, ensuring no mirroring) */
        /* The path goes from base (left-ish) to spout (further left) */

        /* Water Animation */
        #water-stream {
            position: absolute;
            top: 95px; 
            left: 25px; /* Aligned with the nozzle in the SVG */
            width: 15px;
            height: 0; 
            background: rgba(59, 130, 246, 0.6);
            border-radius: 0 0 10px 10px;
            transition: height 0.2s ease-out;
            z-index: 5;
            overflow: hidden;
        }

        #water-stream::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.8), transparent);
            background-size: 100% 50px;
            animation: flow 0.5s linear infinite;
        }

        @keyframes flow {
            from { background-position: 0 -50px; }
            to { background-position: 0 100%; }
        }

        /* IR Sensor Module - Placed to face left */
        .ir-module {
            position: absolute;
            top: 85px;
            left: 22px; /* Positioned under/near nozzle */
            width: 20px;
            height: 12px;
            background: #111;
            border: 1px solid #444;
            border-radius: 2px;
            z-index: 20;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .ir-eye { width: 6px; height: 6px; border-radius: 50%; background: #333; }
        .ir-eye.tx { background: #ff4444; box-shadow: 0 0 5px red; } 

        /* IR Waves Animation */
        #waves-container {
            position: absolute;
            top: 88px;
            right: 170px; 
            width: 400px;
            height: 15px;
            pointer-events: none;
            z-index: 15;
            display: flex;
            flex-direction: row-reverse; 
            align-items: center;
            overflow: hidden;
        }

        .wave-beam {
            position: absolute;
            right: 0;
            width: 100%;
            height: 2px;
            background: repeating-linear-gradient(to left, var(--ir-color) 0, var(--ir-color) 10px, transparent 10px, transparent 40px);
            opacity: 0.3;
            animation: emit 1s linear infinite;
        }

        .wave-echo {
            position: absolute;
            right: 0;
            width: 0; 
            height: 4px;
            background: repeating-linear-gradient(to right, #fbbf24 0, #fbbf24 10px, transparent 10px, transparent 40px);
            opacity: 0.8;
            display: none;
            animation: bounce 1s linear infinite;
        }

        @keyframes emit { from { background-position: 0 0; } to { background-position: -40px 0; } }
        @keyframes bounce { from { background-position: 0 0; } to { background-position: 40px 0; } }

        /* --- HAND (LEFT SIDE) --- */
        #hand-container {
            position: absolute;
            top: 35%; 
            left: 10%; 
            width: 300px;
            height: 150px;
            z-index: 20;
            transition: left 0.05s linear;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hand-svg {
            width: 250px;
            height: auto;
            transform: scaleX(-1) rotate(10deg); /* Mirrored hand to point right toward tap */
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .nfs-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) skewX(-15deg);
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: transparent;
            background: var(--nfs-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
            pointer-events: none;
            white-space: nowrap;
        }

        /* --- CONTROL PANEL (LEFT SIDE) --- */
        #control-panel {
            position: absolute;
            left: 30px;
            top: 30px;
            bottom: 30px;
            width: 320px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 10px 0 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 40px 30px;
            z-index: 100;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-label {
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .panel-value {
            color: var(--accent-color);
            font-family: monospace;
            font-size: 1.2rem;
        }

        input[type=range] {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 30px;
            height: 30px;
            background: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 0 15px var(--accent-color);
        }

        .status-display {
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .status-text {
            display: block;
            font-size: 1.6rem;
            font-weight: 800;
            color: #ef4444;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .logic-card {
            background: #020617;
            color: #4ade80;
            padding: 20px;
            border-radius: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .tag {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.3);
            pointer-events: none;
            white-space: nowrap;
        }

        @media (max-width: 900px) {
            body, html {
                width: 100%;
                height: auto;
                min-height: 100vh;
                min-height: 100svh;
                overflow-x: hidden;
                overflow-y: auto;
            }

            #scene {
                min-height: max(100vh, 820px);
                min-height: max(100svh, 820px);
                height: auto;
            }

            #wall-section {
                width: clamp(170px, 40vw, 240px);
            }

            #sink-assembly {
                right: 16px;
                top: 52%;
            }

            #waves-container {
                width: min(400px, 70vw);
                right: clamp(120px, 30vw, 170px);
            }

            #hand-container {
                top: 57%;
                width: min(300px, 76vw);
            }

            #control-panel {
                top: 16px;
                right: 16px;
                bottom: auto;
                left: 16px;
                width: auto;
                min-height: 0;
                padding: 20px;
                gap: 14px;
            }

            #control-panel h2 {
                font-size: 1.1rem !important;
            }

            .control-group {
                gap: 10px;
            }

            .status-display {
                padding: 14px;
            }

            .status-text {
                font-size: 1.3rem;
            }

            .logic-card {
                padding: 14px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 600px) {
            #scene {
                min-height: max(100vh, 860px);
                min-height: max(100svh, 860px);
            }

            #control-panel {
                left: 12px;
                right: 12px;
                padding: 16px;
            }

            #sink-assembly {
                top: 52%;
                right: 0;
                transform: scale(0.8);
                transform-origin: top right;
            }

            #waves-container {
                width: 65vw;
                right: 130px;
            }

            #hand-container {
                top: 57%;
                width: 250px;
            }

            .hand-svg {
                width: min(210px, 55vw);
            }

            .nfs-text {
                font-size: 1.35rem;
            }
        }

    </style>
</head>
<body>

    <div id="scene">

        <!-- Wall & Sink Section (Anchored Right) -->
        <div id="wall-section">
            <div id="sink-assembly">
                <div class="tag" style="top: -40px; right: 0;">Smart_Tap System</div>

                <!-- Tap Assembly pointing LEFT toward the hand -->
                <svg width="200" height="250" viewBox="0 0 200 250" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Tap Body: Base at right, Spout at left -->
                    <path d="M140 100 L140 50 Q140 20 110 20 L70 20 Q40 20 40 50 L40 80" stroke="#cbd5e1" stroke-width="12" fill="none" />
                    <rect x="130" y="100" width="20" height="40" fill="#94a3b8" stroke="none"/> <!-- Base -->
                    <rect x="25" y="80" width="30" height="15" fill="#64748b" stroke="none"/> <!-- Nozzle at Left -->

                    <!-- Sink Basin -->
                    <path d="M20 140 L180 140 L160 220 Q100 240 40 220 Z" fill="#334155" stroke="#475569" stroke-width="4"/>
                    <line x1="20" y1="140" x2="180" y2="140" stroke="#94a3b8" stroke-width="4"/>
                </svg>

                <!-- IR Sensor facing left -->
                <div class="ir-module">
                    <div class="ir-eye tx"></div>
                    <div class="ir-eye rx"></div>
                </div>
                <div class="tag" style="top: 85px; left: -10px; font-size: 0.6rem; border-color: var(--ir-color); color: var(--ir-color);">IR SENSOR</div>

                <!-- Water Animation - Aligned with Nozzle at x=25 -->
                <div id="water-stream" style="left: 32px;"></div>

                <!-- IR Waves emitting left -->
                <div id="waves-container">
                    <div class="wave-beam"></div>
                    <div class="wave-echo" id="wave-echo"></div>
                </div>
            </div>
        </div>

        <!-- Moving Hand (Approaching from left) -->
        <div id="hand-container">
            <div class="nfs-text" id="hand-text">robo-world</div>
            <svg class="hand-svg" viewBox="0 0 100 100" fill="#facc15">
                <path d="M10,50 Q10,40 30,40 L60,40 Q70,40 70,30 L70,20 Q70,10 80,10 L90,10 Q100,10 100,20 L100,70 Q100,80 90,80 L40,80 Q10,80 10,50 Z" fill="#d4d4d4" stroke="#404040" stroke-width="2"/>
                <path d="M30,40 L40,80" stroke="#404040" stroke-width="1" opacity="0.3"/>
            </svg>
            <div class="tag" style="bottom: -20px; left: 50%; transform: translateX(-50%);">Obstacle: Hand</div>
        </div>

        <!-- Glass Control Panel (Moved to Left) -->
        <div id="control-panel">
            <h2 style="margin: 0; font-size: 1.2rem; color: var(--accent-color); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Control Panel</h2>

            <div class="control-group">
                <div class="panel-label">
                    <span>Hand Position</span>
                    <span class="panel-value" id="dist-display">80cm</span>
                </div>
                <input type="range" id="hand-slider" min="0" max="100" value="20">
            </div>

            <div class="status-display">
                <span style="font-size: 0.7rem; color: #94a3b8; text-transform: uppercase;">Sensor Status</span>
                <span class="status-text" id="status-text">WAITING</span>
            </div>

            <div class="logic-card" id="logic-card">
                if (distance < threshold) {<br>
                &nbsp;&nbsp;tap = ON;<br>
                }
            </div>
        </div>

    </div>

    <script>
        const slider = document.getElementById('hand-slider');
        const hand = document.getElementById('hand-container');
        const water = document.getElementById('water-stream');
        const statusText = document.getElementById('status-text');
        const distDisplay = document.getElementById('dist-display');
        const echoWave = document.getElementById('wave-echo');
        const logicCard = document.getElementById('logic-card');
        const handText = document.getElementById('hand-text');

        // Logic Threshold
        const THRESHOLD_CM = 25; 

        function updateSimulation() {
            const sliderVal = parseInt(slider.value);

            // 1. Move Hand
            // Map 0-100 slider to travel from far left toward the sink assembly on the right
            // We'll calculate the 'right-most' stop point based on screen width
            const leftPos = 10 + (sliderVal * 0.65); 
            hand.style.left = leftPos + '%';

            // 2. Calculate Distance 
            // 0 slider = 100cm (far), 100 slider = 0cm (under tap)
            const distance = 100 - sliderVal;
            distDisplay.innerText = distance + 'cm';

            // 3. Sensor Logic
            const isDetected = distance <= THRESHOLD_CM;

            if (isDetected) {
                water.style.height = '150px';
                statusText.innerText = "DETECTED";
                statusText.style.color = "#22d3ee";

                echoWave.style.display = "block";
                // Echo fills the gap between tap and hand
                echoWave.style.width = (100 - distance) + '%';
                handText.style.textShadow = "0 0 15px #facc15";
            } else {
                water.style.height = '0px';
                statusText.innerText = "WAITING...";
                statusText.style.color = "#ef4444";

                echoWave.style.display = "none";
                handText.style.textShadow = "2px 2px 0px rgba(0,0,0,0.8)";
            }

            // Update Code Display
            logicCard.innerHTML = `// IR SENSOR LOGIC<br>
            if (${distance}cm < ${THRESHOLD_CM}cm) {<br>
            &nbsp;&nbsp;Smart_Tap = <span style="color:#22d3ee">ON</span>;<br>
            } else {<br>
            &nbsp;&nbsp;Smart_Tap = <span style="color:#ef4444">OFF</span>;<br>
            }`;
        }

        slider.addEventListener('input', updateSimulation);
        updateSimulation();
    </script>
</body>
</html>
